name: Continuous ingestion

# The running-ledger worker: sweeps Base x402 settlements on a schedule,
# accumulates them into the persistent SQLite ledger (out/counterra.db),
# and commits the updated db + human-readable reports back to the repo.
#
# Base uses Blockscout's free public API, so no secrets are required.
# Runs on a schedule and on-demand (workflow_dispatch button in the Actions tab).

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC). Cron is in UTC.
    # Adjust the frequency here if you want it more/less often.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Allow the job to push commits back to the repo.
permissions:
  contents: write

# Never run two ingests at once (they'd race on the db); queue instead.
concurrency:
  group: continuous-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # kill a stuck run instead of hanging (saves Actions minutes)
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Refresh the facilitator census (non-fatal)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          # Every x402 facilitator wallet from the x402scan community registry
          # (30+ facilitators, ~90 live wallets). Sweeps below visit the census,
          # not a hand-copied list - hardcoded facilitator lists go stale.
          # If the registry is unreachable the previous docs/facilitators.json
          # is kept and used.
          python3 counterra.py census --write

      - name: Sweep Solana and accumulate (non-fatal)
        timeout-minutes: 6
        continue-on-error: true
        env:
          # Optional: add a free Helius (or any) RPC URL as the repository
          # secret SOLANA_RPC_URL. Unset = public RPC (heavily rate-limited
          # from GitHub runners - Solana is ~70% of x402 volume, so this
          # secret is the single biggest coverage upgrade available).
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          # Solana runs FIRST and is allowed to fail: the public RPC
          # (api.mainnet-beta.solana.com) rate-limits datacenter IPs like GitHub
          # runners, and a throttled Solana sweep must never block Base
          # ingestion or the commit below. Base runs second so the committed
          # reports reflect the larger dataset.
          python3 counterra.py live --continuous --chain solana --limit 30

      - name: Sweep Base and accumulate into the running ledger
        timeout-minutes: 12
        continue-on-error: true
        env:
          # Free key from dev.blockscout.com, saved as repository secret
          # BLOCKSCOUT_API_KEY. Blockscout's keyless per-instance API no
          # longer answers GitHub runners (Base read 0 from 2026-10-06).
          # Base is read straight from a Base RPC node (Blockscout removed Base
          # from its free tier on 2026-10-01). Optional repository secret
          # BASE_RPC_URL: a free Alchemy/QuickNode/Ankr Base mainnet URL.
          # Unset = public https://mainnet.base.org (works, but rate-limited).
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          # Soft wall-clock budget INSIDE the sweep (seconds). The adapter stops
          # gracefully at this point and returns what it decoded, so the commit
          # step below still runs. Must stay comfortably under timeout-minutes.
          COUNTERRA_SWEEP_BUDGET: "420"
        run: |
          # Limit kept modest: the free Blockscout public API is throttled,
          # and a large sweep from GitHub's network can stall. 40 is a safe
          # steady cadence; the ledger accumulates across runs anyway.
          #
          # continue-on-error: a throttled Blockscout used to kill this step and
          # SKIP the commit below — discarding the run's work including an
          # already-successful Solana sweep. Ingestion is idempotent and
          # accumulating, so a partial run must still commit.
          # rpc mode reads every block since the last run (block watermark in
          # out/sweep_schedule.json); --limit caps settlement receipts per run.
          python3 counterra.py live --continuous --chain base --limit 3000
          echo "--- status after run ---"
          python3 counterra.py status

      - name: Grow the seller registry (autogrow - non-fatal)
        timeout-minutes: 6
        continue-on-error: true
        env:
          # Lets the crawler's GitHub harvest run authenticated (higher
          # rate limits); provided automatically by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Three sources every run: discovery catalogs, on-chain names
          # (Basenames / verified contracts), and the endpoint crawl.
          # VERIFIED (mechanical) evidence auto-appends to providers.json;
          # PROBABLE evidence only queues in pending-providers.json for
          # human review - nothing unverified is ever published.
          python3 counterra.py autogrow --write --limit 15 --crawl-limit 20

      - name: Label every wallet and categorise every payment (non-fatal)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          # Rebuilds the network label book from the whole ledger: evidence
          # tier per wallet, category + account per payment, wash/test flags,
          # coverage, and the identification work queue (printed below).
          python3 counterra.py label --write --top 15

      - name: Rebuild the public network explorer (non-fatal)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          # docs/data/ -> counterra.xyz/explorer.html: every seller's observed
          # revenue, buyers, pricing, and a downloadable revenue ledger.
          python3 counterra.py explorer --write

      - name: Commit updated ledger and reports
        run: |
          git config user.name  "counterra-bot"
          git config user.email "actions@github.com"
          # Only the ledger + the Base report: the CSV exports are
          # regenerable from the ledger and committing them caused a
          # local/bot collision on every local run.
          git add out/counterra.db out/spend_report_base.html
          # Registry growth from autogrow (safe if unchanged this run):
          git add docs/providers.json docs/pending-providers.json out/crawl_state.json 2>/dev/null || true
          # Census, label book, coverage, and the sweep schedule:
          git add docs/facilitators.json docs/labels.json docs/coverage.json out/sweep_schedule.json 2>/dev/null || true
          git add -A docs/data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new data this run — nothing to commit."
          else
            git commit -m "chore(ledger): scheduled ingest $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Rebase-pull in case anything else pushed since checkout, then push.
            git pull --rebase --autostash origin main || true
            git push
          fi
